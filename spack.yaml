# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
# Instructions for editing this file are found in
# https://github.com/ACCESS-NRI/model-deployment-template/blob/main/spack.yaml
spack:
  # _name and _version are reserved definitions that inform deployments
  definitions:
  - _name: [access-om3]
  - _version: [2026.05.004]
  # _spack-version and _custom-scopes inform the branch of spack to use, and custom scopes if applicable, respectively
  - _spack-version: ['1.1']
  # Release database provenance information - packages for inclusion into the database, and packages just for injection into the modules
  - _provenance: [access-cice, access-mom6, access-ww3, access3, access3-share, access-generic-tracers, access-mocsy]
  - _injection: []
  specs:
  - access-om3
  packages:
    # Main Dependencies
    access3:
      require:
      - '@2026.03.002'
      - configurations=MOM6,MOM6-CICE6,MOM6-CICE6-WW3
    access-cice:
      require:
      - '@CICE6.6.3-2'
      - io_type=PIO
    access-mom6:
      require:
      - '@2026.05.003'
      - +mom6_solo
    access-ww3:
      require:
      - '@2026.03.001'
    access3-share:
      require:
      - '@2026.03.002'
    access-generic-tracers:
      require:
      - '@2026.09.000'
    access-mocsy:
      require:
      - '@2025.07.002'
    # Other Dependencies
    esmf:
      require:
      - '@8.9.1'
    parallelio:
      require:
      - '@2.6.8'
    netcdf-c:
      require:
      - '@4.9.3'
      - build_system=cmake build_type=RelWithDebInfo
    netcdf-fortran:
      require:
      - '@4.6.2'
    fms:
      require:
      - '@2025.03'

    cray-mpich:
       require:
       - '@9.1.0'
       - '%gcc@14.2.0'

    fortranxml:
      require:
      - '@4.1.2'

    # Workarounds
    gcc::
      externals:
      - spec: gcc@14.3.0 languages:='c,c++,fortran'
        prefix: /opt/cray/pe/gcc-native/14
        extra_attributes:
          compilers:
            c: /opt/cray/pe/gcc-native/14/bin/gcc
            cxx: /opt/cray/pe/gcc-native/14/bin/g++
            fortran: /opt/cray/pe/gcc-native/14/bin/gfortran
      - spec: gcc@14.2.0 languages:='c,c++,fortran'
        prefix: /opt/cray/pe/gcc-native/14
        extra_attributes:
          compilers:
            c: /opt/cray/pe/gcc-native/14/bin/gcc
            cxx: /opt/cray/pe/gcc-native/14/bin/g++
            fortran: /opt/cray/pe/gcc-native/14/bin/gfortran
    py-pip::
      require:
      - '@26.2.2'
    curl:
      require:
      - '@8.17.0'

    # Compilers
    c:
      prefer:
      - gcc@14.3.0
    cxx:
      prefer:
      - gcc@14.3.0
    fortran:
      prefer:
      - gcc@14.3.0

  view: true
  concretizer:
    unify: true
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      tag: 2026.09.005
      destination: $env/package-repos/access-spack-packages
    builtin::
      git: https://github.com/ACCESS-NRI/upstream-spack-packages.git
      branch: access/v1.1
      destination: $env/package-repos/spack-packages
