# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
# Instructions for editing this file are found in
# https://github.com/ACCESS-NRI/model-deployment-template/blob/main/spack.yaml
spack:
  # _name and _version are reserved definitions that inform deployments
  definitions:
  - _name: [access-om3]
  - _version: [2026.05.003]
  # _spack-version and _custom-scopes inform the branch of spack to use, and custom scopes if applicable, respectively
  - _spack-version: ['1.1']
  # Release database provenance information - packages for inclusion into the database, and packages just for injection into the modules
  - _provenance: [access-cice, access-mom6, access-ww3, access3, access3-share, access-generic-tracers, access-mocsy]
  # Don't explcitly include openmpi, unlike the current build
  - _injection: []
  specs:
  - access-om3
  packages:
    # Main Dependencies
    access3:
      require:
      - '@2026.03.002'
      - configurations=MOM6,MOM6-CICE6,MOM6-CICE6-WW3
      - fflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
      - cflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
    access-cice:
      require:
      - '@CICE6.6.3-2'
      - io_type=PIO
      - '+io_timers'
      - fflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
      - cflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
    access-mom6:
      require:
      - '@git.0b48afd2da5f10fdb34d079ce3c538cfc421b1de'
      - +mom6_solo
      - fflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
      - cflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
    access-ww3:
      require:
      - '@2026.03.001'
    access3-share:
      require:
      - '@2026.03.002'
      - fflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
      - cflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
    access-generic-tracers:
      require:
      - '@git.115890145fc60799593aaae5a881f90cc9afa506'
      - fflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
    access-mocsy:
      require:
      - '@2025.07.002'
      - fflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
      - cflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
    # Other Dependencies
    esmf:
      require:
      - '@8.9.1'
      - fflags="-march=sapphirerapids -mtune=sapphirerapids -unroll -traceback"
      - cflags="-march=sapphirerapids -mtune=sapphirerapids -unroll -fno-omit-frame-pointer"
      - cxxflags="-march=sapphirerapids -mtune=sapphirerapids -unroll -fno-omit-frame-pointer"
    parallelio:
      require:
      - '@2.6.8'
      - +logging
      - +pnetcdf
      - fflags="-g -traceback"
      - cflags="-g -fno-omit-frame-pointer"
      - cxxflags="-g -fno-omit-frame-pointer"
    netcdf-c:
      require:
      - '@4.9.3'
      - build_system=cmake build_type=RelWithDebInfo
    netcdf-fortran:
      require:
      - '@4.6.2'
    fms:
      require:
      - '@2025.03'
      - fflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
      - cflags="-march=sapphirerapids -mtune=sapphirerapids -unroll"
      - cppflags="-DMAXFIELDMETHODS_=600"
    openmpi:
      require:
      - '@5.0.8'
    fortranxml:
      require:
      - '@4.1.2'
    python:
      require:
      - '@3.11.7'   # force spack to use the system python install
    # Compilers
    c:
      require:
      - intel-oneapi-compilers@2025.2.0
    cxx:
      require:
      - intel-oneapi-compilers@2025.2.0
    fortran:
      require:
      - intel-oneapi-compilers@2025.2.0

    all:
      prefer:
      - target=x86_64_v4
  view: true
  concretizer:
    unify: true
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      tag: ea43d3e333dad21b61b706694ea0a22620cfff1b
      destination: $env/package-repos/access-spack-packages
  modules:
    default:
      tcl:
        # Don't exclude openmpi, overriding spack-config 2026.10.002
        exclude: []
